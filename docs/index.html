<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PillBuddy Legal</title>
  <style>
    :root {
      --bg: #f7faf8;
      --ink: #1a2e24;
      --muted: #4a6356;
      --accent: #2d6a4f;
      --line: #d5e3db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.85rem;
      line-height: 1.2;
      margin: 0 0 0.35rem;
      color: var(--accent);
    }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    ul { padding-left: 1.25rem; }
    li { margin-bottom: 0.6rem; font-size: 1.05rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>PillBuddy</h1>
    <p class="meta">Privacy policy and disclaimer</p>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="disclaimer.html">Disclaimer</a></li>
    </ul>
  </main>
</body>
</html>
